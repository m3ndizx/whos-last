name: Export Godot Web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The Godot project lives in src/ (the code root). Every godot call passes
# --path src, and the build output is src/build/web.
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd # Godot 4.7.2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Godot reads its data folder from XDG_DATA_HOME. Point it at the runner temp
      # folder, which is the same path on the host, so the cache step can save and
      # restore the export templates there.
      - name: Restore Godot export templates cache
        id: templates
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/godot-data/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-web-templates-ca4d71c4d7b8

      # The CI image has no curl, unzip or libfontconfig. Without libfontconfig,
      # Godot logs a fontconfig error on every run.
      - name: Install system packages
        run: |
          set -eu
          pkgs=""
          command -v curl >/dev/null || pkgs="$pkgs curl"
          command -v unzip >/dev/null || pkgs="$pkgs unzip"
          find /usr/lib /lib -name 'libfontconfig.so.1' 2>/dev/null | grep -q . || pkgs="$pkgs libfontconfig1"
          if [ -n "$pkgs" ]; then
            apt-get update -qq
            apt-get install -y -qq $pkgs
          fi

      # The CI image ships without export templates, so the Web export fails with
      # "No export template found" unless they are installed. Fetch the official
      # 4.7.2 templates only on a cache miss, and check them against Godot's
      # published SHA512 before installing.
      - name: Download and verify export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          set -eu
          tmp="$(mktemp -d)"
          curl -sSfL -o "$tmp/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  $tmp/templates.tpz" | sha512sum -c -
          dest="$RUNNER_TEMP/godot-data/godot/export_templates/4.7.2.stable"
          mkdir -p "$dest"
          unzip -j -o "$tmp/templates.tpz" "templates/web_nothreads_release.zip" "templates/version.txt" -d "$dest"
          rm -rf "$tmp"

      # .godot/ is gitignored, so a clean checkout has no imported assets.
      # Import first, or the export ships without textures and icons.
      - name: Import assets
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/godot-data
        run: godot --headless --path src --import

      - name: Export Web build
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/godot-data
        run: |
          mkdir -p src/build/web
          # Godot resolves export paths inside the project, so this is relative to src/.
          godot --headless --verbose --path src --export-release "Web" build/web/index.html

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-build
          path: src/build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: web-build
          path: src/build/web

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: src/build/web

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
