name: Export Godot Web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The Godot project lives in src/ (the code root). Every godot call passes
# --path src, and the build output is src/build/web.
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd # Godot 4.7.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # .godot/ is gitignored, so a clean checkout has no imported assets.
      # Import first, or the export ships without textures and icons.
      - name: Import assets
        run: godot --headless --path src --import

      - name: Export Web build
        run: |
          mkdir -p src/build/web
          # Godot resolves export paths inside the project, so this is relative to src/.
          godot --headless --verbose --path src --export-release "Web" build/web/index.html

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-build
          path: src/build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-build
          path: src/build/web

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: src/build/web

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
